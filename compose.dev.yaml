# Local development: only PostgreSQL, reachable on 127.0.0.1:5432.
#   docker compose -f compose.dev.yaml up -d
#   DATABASE_URL=postgres://napfdeal:napfdeal@localhost:5432/napfdeal npm run dev
name: napfdeal-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: napfdeal
      POSTGRES_USER: napfdeal
      POSTGRES_PASSWORD: napfdeal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
