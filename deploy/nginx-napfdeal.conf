# Example for a server that already runs nginx on 80/443.
# 1. cp deploy/nginx-napfdeal.conf /etc/nginx/sites-available/napfdeal.com
#    ln -s /etc/nginx/sites-available/napfdeal.com /etc/nginx/sites-enabled/
# 2. nginx -t && systemctl reload nginx
# 3. certbot --nginx -d napfdeal.com -d www.napfdeal.com   (adds the 443 block + redirect automatically)
#
# No access log on purpose (data minimisation: no IP addresses on disk).

server {
    listen 80;
    listen [::]:80;
    server_name napfdeal.com www.napfdeal.com;

    access_log off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
